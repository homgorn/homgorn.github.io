---
layout: default
---

<article class="service-detail">
  <header class="service-header">
    <h1>{{ page.title }}</h1>
    {% if page.price %}
    <div class="price">от {{ page.price }} ₽</div>
    {% endif %}
  </header>

  <div class="description">
    <p>{{ page.description }}</p>
  </div>

  <div class="content">
    {{ content }}
  </div>

  {% if page.tags %}
  <div class="tags">
    <span class="label">Теги:</span>
    {% for tag in page.tags %}
    <span class="tag">{{ tag }}</span>
    {% endfor %}
  </div>
  {% endif %}

  <div class="actions">
    <a href="https://t.me/notview" class="btn">Заказать</a>
  </div>
</article>
